<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e293b">
  <title>Catálogo Profesional</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    .book {
      perspective: 2000px;
    }

    .page {
      width: 100%;
      min-height: 500px;
      background: white;
      color: black;
      border-radius: 12px;
      padding: 30px;
      position: absolute;
      transition: transform 0.8s;
      transform-origin: left;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .page.flipped {
      transform: rotateY(-180deg);
    }

    .controls {
      margin-top: 20px;
    }

    .btn-custom {
      border-radius: 50px;
      padding: 10px 25px;
      font-weight: bold;
    }

    /* Chatbot */
    .chatbot-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 300px;
      height: 400px;
      z-index: 1000;
    }

    .chatbot-header {
      background: #1e293b;
      color: white;
      padding: 10px;
      text-align: center;
      border-radius: 10px 10px 0 0;
    }

    .chatbot-messages {
      height: 75%;
      overflow-y: auto;
      padding: 10px;
      background: #f9f9f9;
    }

    .chatbot-input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 0 0 10px 10px;
      outline: none;
    }

    /* Contraste Alto */
    .high-contrast {
      background-color: #000;
      color: #FFF;
    }
  </style>
</head>

<body class="p-6">

  <div class="container text-center">
    <h1 class="text-4xl font-bold mb-6">📘 Catálogo de Herramientas</h1>

    <!-- Libro -->
    <div id="catalogo" class="book relative w-full max-w-3xl mx-auto">
      <div class="page z-30" id="page1">
        <h2 class="text-2xl font-bold mb-4">Bienvenido</h2>
        <p>Explora nuestro catálogo profesional de herramientas de alta calidad.</p>
      </div>

      <div class="page z-20" id="page2">
        <h2 class="text-xl font-bold mb-4">Taladro Profesional</h2>
        <img src="https://via.placeholder.com/300" class="mx-auto mb-4 rounded">
        <p>Potente taladro ideal para uso industrial.</p>
        <span class="text-green-600 font-bold">$120 USD</span>
      </div>

      <div class="page z-10" id="page3">
        <h2 class="text-xl font-bold mb-4">Caja de Herramientas</h2>
        <img src="https://via.placeholder.com/300" class="mx-auto mb-4 rounded">
        <p>Set completo de herramientas profesionales.</p>
        <span class="text-green-600 font-bold">$85 USD</span>
      </div>
    </div>

    <div class="controls mt-6">
      <button class="btn btn-primary btn-custom me-2" onclick="prevPage()">⬅ Anterior</button>
      <button class="btn btn-success btn-custom me-2" onclick="nextPage()">Siguiente ➡</button>
      <button class="btn btn-danger btn-custom" onclick="downloadPDF()">📄 Descargar PDF</button>
    </div>

    <!-- Botón de instalación de PWA -->
    <button id="installBtn" class="btn btn-warning btn-custom mt-4">Instalar PWA 📲</button>

    <!-- Chatbot -->
    <div id="chatbot" class="chatbot-container">
      <div class="chatbot-header">Asistente Virtual</div>
      <div class="chatbot-messages" id="chatbotMessages"></div>
      <input type="text" id="chatbotInput" class="chatbot-input" placeholder="¿Cómo puedo ayudarte?" onkeydown="if(event.key === 'Enter'){sendMessage();}">
    </div>

  </div>

  <script>
    // Variables
    let currentPage = 1;
    const totalPages = 3;
    let deferredPrompt;

    // Funciones de navegación
    function nextPage() {
      if (currentPage < totalPages) {
        document.getElementById('page' + currentPage).classList.add('flipped');
        currentPage++;
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        document.getElementById('page' + currentPage).classList.remove('flipped');
      }
    }

    function downloadPDF() {
      const element = document.getElementById("catalogo");

      const opt = {
        margin: 0.5,
        filename: 'catalogo_profesional.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Mostrar el botón de instalación de la PWA
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installButton = document.getElementById('installBtn');
      installButton.style.display = 'inline-block';

      installButton.addEventListener('click', () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the install prompt');
          } else {
            console.log('User dismissed the install prompt');
          }
          deferredPrompt = null;
        });
      });
    });

    // Simular un chatbot de IA (esto puede ser una API real más adelante)
    function sendMessage() {
      const inputField = document.getElementById('chatbotInput');
      const message = inputField.value;
      inputField.value = '';

      const messageContainer = document.createElement('div');
      messageContainer.textContent = 'Usuario: ' + message;
      document.getElementById('chatbotMessages').appendChild(messageContainer);

      const responseContainer = document.createElement('div');
      responseContainer.textContent = 'Asistente: Estoy aquí para ayudarte. ¿Buscas alguna herramienta en particular?';
      document.getElementById('chatbotMessages').appendChild(responseContainer);
    }

    // Cambiar a modo alto contraste
    function toggleHighContrast() {
      document.body.classList.toggle('high-contrast');
    }
  </script>

  <script src="service-worker.js"></script>
</body>
</html>
