<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e293b">
  <title>Catálogo Interactivo</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    /* Estilos generales */
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    .book {
      width: 80%;
      max-width: 900px;
      margin: 0 auto;
      perspective: 2000px;
    }

    .page {
      width: 100%;
      height: 500px;
      background: #fff;
      color: #333;
      border-radius: 12px;
      padding: 20px;
      position: absolute;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transform-style: preserve-3d;
      transform-origin: left;
      transition: transform 1s;
    }

    .page img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .page.flipped {
      transform: rotateY(-180deg);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .btn-custom {
      padding: 12px 30px;
      font-weight: bold;
      border-radius: 50px;
    }

    /* Estilos para el botón de instalar PWA */
    #installBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #FFB800;
      border: none;
      border-radius: 50px;
      padding: 15px 30px;
      color: #000;
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    /* Estilos de imagen subida */
    .image-upload-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .image-upload-container img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container text-center">
    <h1 class="text-4xl font-bold mb-6">📘 Catálogo Interactivo</h1>

    <!-- Contenedor del libro -->
    <div class="book" id="catalogo">
      <!-- Páginas del catálogo -->
      <div class="page" id="page1">
        <h2 class="text-2xl font-bold mb-4">Imagen 1</h2>
        <img src="https://via.placeholder.com/800x400?text=Imagen+1" alt="Imagen 1">
      </div>
      <div class="page" id="page2">
        <h2 class="text-2xl font-bold mb-4">Imagen 2</h2>
        <img src="https://via.placeholder.com/800x400?text=Imagen+2" alt="Imagen 2">
      </div>
      <div class="page" id="page3">
        <h2 class="text-2xl font-bold mb-4">Imagen 3</h2>
        <img src="https://via.placeholder.com/800x400?text=Imagen+3" alt="Imagen 3">
      </div>
      <div class="page" id="page4">
        <h2 class="text-2xl font-bold mb-4">Imagen 4</h2>
        <img src="https://via.placeholder.com/800x400?text=Imagen+4" alt="Imagen 4">
      </div>
      <div class="page" id="page5">
        <h2 class="text-2xl font-bold mb-4">Imagen 5</h2>
        <img src="https://via.placeholder.com/800x400?text=Imagen+5" alt="Imagen 5">
      </div>
      <div class="page" id="page6">
        <h2 class="text-2xl font-bold mb-4">Imagen 6</h2>
        <img src="https://via.placeholder.com/800x400?text=Imagen+6" alt="Imagen 6">
      </div>
      <div class="page" id="page7">
        <h2 class="text-2xl font-bold mb-4">Imagen 7</h2>
        <img src="https://via.placeholder.com/800x400?text=Imagen+7" alt="Imagen 7">
      </div>
    </div>

    <!-- Controles para pasar páginas y descargar PDF -->
    <div class="controls">
      <button class="btn btn-primary btn-custom" onclick="prevPage()">⬅ Anterior</button>
      <button class="btn btn-success btn-custom" onclick="nextPage()">Siguiente ➡</button>
      <button class="btn btn-danger btn-custom" onclick="downloadPDF()">📄 Descargar PDF</button>
    </div>

    <!-- Botón de instalación de la PWA -->
    <button id="installBtn">Instalar PWA 📲</button>

    <!-- Contenedor para subir imágenes -->
    <div class="image-upload-container">
      <input type="file" accept="image/*" onchange="uploadImage(event)" multiple id="imageUpload" class="hidden">
      <label for="imageUpload" class="btn btn-warning btn-custom">Subir Imágenes</label>
    </div>
  </div>

  <script>
    let currentPage = 1;
    const totalPages = 7;

    // Función para pasar a la siguiente página
    function nextPage() {
      if (currentPage < totalPages) {
        document.getElementById('page' + currentPage).classList.add('flipped');
        currentPage++;
      }
    }

    // Función para retroceder a la página anterior
    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        document.getElementById('page' + currentPage).classList.remove('flipped');
      }
    }

    // Función para descargar el catálogo como PDF
    function downloadPDF() {
      const element = document.getElementById("catalogo");

      const opt = {
        margin: 0.5,
        filename: 'catalogo_interactivo.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Mostrar el botón de instalación de la PWA
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installButton = document.getElementById('installBtn');
      installButton.style.display = 'inline-block';

      installButton.addEventListener('click', () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Usuario aceptó la instalación');
          } else {
            console.log('Usuario rechazó la instalación');
          }
          deferredPrompt = null;
        });
      });
    });

    // Función para subir imágenes
    function uploadImage(event) {
      const files = event.target.files;
      const imageContainer = document.querySelector('.image-upload-container');

      // Limitar a 7 imágenes
      if (files.length + imageContainer.children.length > 7) {
        alert('Solo puedes subir hasta 7 imágenes.');
        return;
      }

      // Mostrar las imágenes subidas
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = document.createElement('img');
          img.src = e.target.result;
          imageContainer.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }
  </script>

  <script src="service-worker.js"></script>

</body>
</html>
