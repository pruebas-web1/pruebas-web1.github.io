<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Virtual</title>
<meta name="theme-color" content="#000000">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<!-- Swiper CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>

<!-- html2pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body { font-family: 'Helvetica Neue', sans-serif; background:#f5f5f5; margin:0; padding:0; }
h1 { 
  text-align:center; 
  margin:20px 10px; 
  font-size:2rem; 
  font-weight:bold; 
  color:#FF6F00; 
  line-height:1.2; 
}
.swiper { width:100%; max-width:900px; height:580px; margin:auto; border-radius:20px; overflow:hidden; box-shadow:0 15px 35px rgba(0,0,0,0.2); background:#fff; position:relative; }
.swiper-slide { display:flex; justify-content:center; align-items:center; flex-direction:column; padding:20px; border-radius:15px; transition:transform 0.6s; background:#fff; box-shadow:0 8px 25px rgba(0,0,0,0.1); position:relative; }
.swiper-slide img { width:100%; max-height:350px; border-radius:15px; margin-bottom:12px; object-fit:cover; }
.swiper-slide p { margin:0; font-size:1rem; font-weight:500; color:#1f2937; text-align:center; }
.share-btn { margin-top:5px; padding:8px 16px; border-radius:30px; border:none; background-color:#25D366; color:#fff; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:5px; font-size:14px; transition:0.2s; }
.share-btn:hover { opacity:0.85; }
#installBtn { position: fixed; bottom:20px; right:20px; background-color: #000; border:none; border-radius:50px; padding:12px 20px; color:#FF6F00; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:6px; box-shadow:0 5px 15px rgba(0,0,0,0.2); z-index:1000; }
#installBtn i { font-size:16px; color:#FF6F00; }
.upload-container { text-align:center; margin:20px; }
.upload-container input { display:none; }
.upload-container label { padding:12px 25px; background-color:#FF6F00; color:#fff; border-radius:50px; cursor:pointer; font-weight:bold; margin-bottom:15px; display:inline-block; transition:0.2s; }
.upload-container label:hover { opacity:0.85; }
#searchInput { padding:8px 12px; border-radius:8px; border:1px solid #ccc; width:80%; max-width:400px; margin:auto; display:block; margin-bottom:20px; }

/* Animación producto destacado */
@keyframes highlightBounce {
  0%, 100% { transform: scale(1); box-shadow:0 10px 25px rgba(255,111,0,0.5); }
  50% { transform: scale(1.05); box-shadow:0 15px 35px rgba(255,111,0,0.8); }
}

/* Modal Cotización */
.modal { display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; overflow:auto; background-color: rgba(0,0,0,0.5); }
.modal-content { background:#fff; margin:10% auto; padding:20px; border-radius:10px; max-width:400px; position:relative; }
.modal-close { position:absolute; top:10px; right:15px; font-size:20px; cursor:pointer; font-weight:bold; }
.modal input, .modal textarea { width:100%; margin-bottom:10px; padding:8px; border-radius:5px; border:1px solid #ccc; }
.modal button { background:#FF6F00; color:#fff; padding:10px; border:none; border-radius:10px; cursor:pointer; font-weight:bold; width:100%; }
</style>
</head>
<body>

<h1>🔧 Catálogo Virtual</h1>
<br>
<input type="text" id="searchInput" placeholder="🔍 Buscar herramienta...">

<div class="swiper" id="catalogo">
  <div class="swiper-wrapper" id="slidesContainer">
    <!-- Productos de prueba 4 -->
    <div class="swiper-slide">
      <img src="/imagen2.png">
      <p>Martillo profesional de acero con mango antideslizante</p>
      <button class="share-btn" onclick="shareWhatsApp('Martillo profesional de acero con mango antideslizante https://images.unsplash.com/photo-1603808033193-3f9b42f68297')"><i class="bi bi-whatsapp"></i> Compartir</button>
      <button class="share-btn" style="background:#FF6F00;margin-top:5px;" onclick="openModal('Martillo profesional de acero con mango antideslizante')">Solicitar Cotización</button>
    </div>
    <div class="swiper-slide">
      <img src="/imagen3.png" alt="Taladro">
      <p>Taladro eléctrico profesional 550W, velocidad variable</p>
      <button class="share-btn" onclick="shareWhatsApp('Taladro eléctrico profesional 550W, velocidad variable https://images.unsplash.com/photo-1580657018435-688d03d1c5aa')"><i class="bi bi-whatsapp"></i> Compartir</button>
      <button class="share-btn" style="background:#FF6F00;margin-top:5px;" onclick="openModal('Taladro eléctrico profesional 550W, velocidad variable')">Solicitar Cotización</button>
    </div>
    <div class="swiper-slide">
      <img src="/imagen4.png" alt="Destornillador">
      <p>Set de destornilladores profesionales 6 piezas, mango ergonómico</p>
      <button class="share-btn" onclick="shareWhatsApp('Set de destornilladores profesionales 6 piezas, mango ergonómico https://images.unsplash.com/photo-1598032891224-28c29f899e8f')"><i class="bi bi-whatsapp"></i> Compartir</button>
      <button class="share-btn" style="background:#FF6F00;margin-top:5px;" onclick="openModal('Set de destornilladores profesionales 6 piezas, mango ergonómico')">Solicitar Cotización</button>
    </div>
    <div class="swiper-slide">
      <img src="/imagen1.png" alt="Llave Inglesa">
      <p>Llave inglesa ajustable profesional, acero cromado</p>
      <button class="share-btn" onclick="shareWhatsApp('Llave inglesa ajustable profesional, acero cromado https://images.unsplash.com/photo-1616480559316-4461f95e03e0')"><i class="bi bi-whatsapp"></i> Compartir</button>
      <button class="share-btn" style="background:#FF6F00;margin-top:5px;" onclick="openModal('Llave inglesa ajustable profesional, acero cromado')">Solicitar Cotización</button>
    </div>
  </div>
</div>

<div class="upload-container">
  <input type="file" id="imageUpload" accept="image/*" multiple>
  <label for="imageUpload">➕ Agregar Imágenes</label>
  <button onclick="downloadPDF()">📄 Descargar PDF</button>
</div>

<button id="installBtn"><i class="bi bi-phone"></i> Instalar</button>

<div class="modal" id="cotizacionModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <h3 class="font-bold mb-2">Solicitar Cotización</h3>
    <input type="text" id="modalName" placeholder="Nombre">
    <input type="email" id="modalEmail" placeholder="Correo electrónico">
    <input type="tel" id="modalPhone" placeholder="Teléfono">
    <textarea id="modalMessage" placeholder="Mensaje"></textarea>
    <button onclick="sendQuote()">Enviar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script>
const swiper = new Swiper('.swiper', {
  effect:'coverflow',
  grabCursor:true,
  centeredSlides:true,
  slidesPerView:'auto',
  coverflowEffect:{rotate:30,stretch:0,depth:200,modifier:1,slideShadows:true},
  loop:false
});

// Producto destacado animado
const slidesContainer=document.getElementById('slidesContainer');
const featuredSlide=document.createElement('div');
featuredSlide.classList.add('swiper-slide');
featuredSlide.style.border='3px solid #FF6F00';
featuredSlide.style.animation='highlightBounce 2s infinite';
featuredSlide.style.position='relative';

const featuredLabel=document.createElement('div');
featuredLabel.textContent='🎉 Nuevo';
featuredLabel.style.position='absolute';
featuredLabel.style.top='15px';
featuredLabel.style.left='15px';
featuredLabel.style.backgroundColor='#FF6F00';
featuredLabel.style.color='#fff';
featuredLabel.style.padding='5px 10px';
featuredLabel.style.borderRadius='8px';
featuredLabel.style.fontWeight='bold';
featuredLabel.style.zIndex='10';
featuredSlide.appendChild(featuredLabel);

const fImg=document.createElement('img');
fImg.src='https://images.unsplash.com/photo-1598032891224-28c29f899e8f?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=800';
fImg.alt='Juego de llaves';
featuredSlide.appendChild(fImg);

const fDesc=document.createElement('p');
fDesc.textContent='Juego de llaves ajustables profesionales, acero reforzado';
featuredSlide.appendChild(fDesc);

const fShare=document.createElement('button');
fShare.classList.add('share-btn');
fShare.innerHTML='<i class="bi bi-whatsapp"></i> Compartir';
fShare.onclick=()=> shareWhatsApp(fDesc.textContent+' '+fImg.src);
featuredSlide.appendChild(fShare);

const fQuote=document.createElement('button');
fQuote.classList.add('share-btn');
fQuote.style.background='#FF6F00';
fQuote.style.marginTop='5px';
fQuote.innerText='Solicitar Cotización';
fQuote.onclick=()=> openModal(fDesc.textContent);
featuredSlide.appendChild(fQuote);

slidesContainer.insertBefore(featuredSlide,slidesContainer.firstChild);
swiper.update();

// Subir imágenes
const imageInput=document.getElementById('imageUpload');
imageInput.addEventListener('change',(event)=>{
  const files=Array.from(event.target.files);
  files.forEach(file=>{
    const description=prompt("Agrega una descripción para la imagen:");
    const reader=new FileReader();
    reader.onload=e=>{
      const slide=document.createElement('div');
      slide.classList.add('swiper-slide');
      const img=document.createElement('img');
      img.src=e.target.result;
      slide.appendChild(img);
      const p=document.createElement('p');
      p.textContent=description||'Sin descripción';
      slide.appendChild(p);
      const shareBtn=document.createElement('button');
      shareBtn.classList.add('share-btn');
      shareBtn.innerHTML='<i class="bi bi-whatsapp"></i> Compartir';
      shareBtn.onclick=()=> shareWhatsApp(description+' '+e.target.result);
      slide.appendChild(shareBtn);
      const quoteBtn=document.createElement('button');
      quoteBtn.classList.add('share-btn');
      quoteBtn.style.background='#FF6F00';
      quoteBtn.style.marginTop='5px';
      quoteBtn.innerText='Solicitar Cotización';
      quoteBtn.onclick=()=> openModal(description);
      slide.appendChild(quoteBtn);
      slidesContainer.appendChild(slide);
      swiper.update();
    };
    reader.readAsDataURL(file);
  });
  imageInput.value='';
});

// Buscador
const searchInput=document.getElementById('searchInput');
searchInput.addEventListener('input',()=>{
  const query=searchInput.value.toLowerCase();
  swiper.slides.forEach(slide=>{
    const desc=slide.querySelector('p').textContent.toLowerCase();
    slide.style.display=desc.includes(query)? 'flex':'none';
  });
  swiper.update();
});

// WhatsApp correcto
function shareWhatsApp(text){
  const url = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(text);
  window.open(url,'_blank');
}

// PDF profesional
function downloadPDF(){
  const slides=document.querySelectorAll('.swiper-slide');
  const container=document.createElement('div');
  slides.forEach(slide=>{
    const page=document.createElement('div');
    page.style.pageBreakAfter='always';
    page.style.textAlign='center';
    page.style.padding='20px';
    const img=slide.querySelector('img').cloneNode();
    img.style.maxWidth='600px';
    const p=slide.querySelector('p').cloneNode(true);
    p.style.fontSize='18px';
    p.style.marginTop='10px';
    page.appendChild(img);
    page.appendChild(p);
    container.appendChild(page);
  });
  html2pdf().set({margin:0.5, filename:'catalogo_virtual.pdf', image:{type:'jpeg', quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'in', format:'letter', orientation:'portrait'}}).from(container).save();
}

// PWA Install
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  const installBtn=document.getElementById('installBtn');
  installBtn.style.display='flex';
  installBtn.onclick=()=>{
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{deferredPrompt=null;});
  };
});

// Modal Cotización
const modal=document.getElementById('cotizacionModal');
function openModal(product){
  modal.style.display='block';
  document.getElementById('modalMessage').value='Estoy interesado en: '+product;
}
function closeModal(){ modal.style.display='none'; }
function sendQuote(){
  const name=document.getElementById('modalName').value;
  const email=document.getElementById('modalEmail').value;
  const phone=document.getElementById('modalPhone').value;
  const message=document.getElementById('modalMessage').value;
  if(!name||!email||!phone||!message){ alert('Complete todos los campos'); return; }
  alert('¡Solicitud enviada!\nNombre: '+name+'\nCorreo: '+email+'\nTeléfono: '+phone+'\nMensaje: '+message);
  closeModal();
}
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Crear header si no existe
  let existingHeader = document.querySelector('header');
  if (!existingHeader) {
    const header = document.createElement('header');
    header.style.display = 'flex';
    header.style.justifyContent = 'space-between';
    header.style.alignItems = 'center';
    header.style.padding = '10px 20px';
    header.style.backgroundColor = '#000';
    header.style.color = '#FF6F00';
    header.style.position = 'sticky';
    header.style.top = '0';
    header.style.zIndex = '100';
    
    // Título dentro del header
    const title = document.createElement('h1');
    title.textContent = '🔧 Catálogo Virtual Profesional';
    title.style.fontSize = '1.5rem';
    title.style.margin = '0';
    
    header.appendChild(title);
    
    // Botón de instalación
    const installBtn = document.getElementById('installBtn');
    installBtn.style.position = 'static';
    installBtn.style.margin = '0';
    installBtn.style.flexShrink = '0';
    installBtn.style.display = 'flex';
    installBtn.style.alignItems = 'center';
    installBtn.style.gap = '5px';
    
    header.appendChild(installBtn);
    
    // Insertar header antes del h1 original
    const h1 = document.querySelector('h1');
    if (h1) {
      h1.style.display = 'none'; // ocultamos el h1 original
      h1.parentNode.insertBefore(header, h1);
    } else {
      document.body.insertBefore(header, document.body.firstChild);
    }
  }
});
</script>

  
</body>
</html>
